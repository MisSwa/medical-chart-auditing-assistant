[project]
name = "medical-chart-auditing-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "anthropic>=0.28.0",
    "pdfplumber>=0.11.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "fpdf2>=2.7.9",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: marks tests that make real external API calls (deselect with '-m not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
